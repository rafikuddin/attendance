name: Build APK
on:
  push:
    paths-ignore:
      - 'update*.zip'
      - '**.md'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Makes sure the Android SDK pieces this app needs are installed and their licences accepted.
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        shell: bash
        run: gradle assembleDebug --stacktrace --console=plain 2>&1 | tee build.log

      # Only when the build fails: put the REAL error at the top of the run page, so nobody has to dig through the log.
      - name: Show the real error
        if: failure()
        shell: bash
        run: |
          {
            echo "## ❌ Build failed - the real error"
            echo
            echo '```'
            grep -E '^e: |error: |AAPT|Execution failed|Could not |not found|licen' build.log | head -25 || true
            echo
            sed -n '/What went wrong/,/\* Try/p' build.log | head -30 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -E '^e: |error: |AAPT' build.log | head -10 | while IFS= read -r line; do echo "::error::${line}"; done || true

      - name: Save full log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
