name: Build APK
on:
  push:
    paths-ignore:
      - 'update*.zip'
      - '**.md'
  workflow_dispatch:

# Needed so the build can publish the APK on the repo's Releases page.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      VERSION: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Makes sure the Android SDK pieces this app needs are installed and their licences accepted.
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      # verCode = the run number, so every build is a higher version than the one before (1.0.<run number>).
      - name: Build debug APK
        shell: bash
        run: gradle assembleDebug -PverCode=${{ github.run_number }} --stacktrace --console=plain 2>&1 | tee build.log

      # Only when the build fails: put the REAL error at the top of the run page.
      - name: Show the real error
        if: failure()
        shell: bash
        run: |
          {
            echo "## ❌ Build failed - the real error"
            echo
            echo '```'
            grep -E '^e: |error: |AAPT|Execution failed|Could not |not found|licen' build.log | head -25 || true
            echo
            sed -n '/What went wrong/,/\* Try/p' build.log | head -30 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -E '^e: |error: |AAPT' build.log | head -10 | while IFS= read -r line; do echo "::error::${line}"; done || true

      - name: Save full log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Name the APK with its version
        run: cp app/build/outputs/apk/debug/app-debug.apk "SAM-BOND-Attendance-v${VERSION}.apk"

      - name: Summary
        run: echo "### ✅ Built version ${VERSION}" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: SAM-BOND-Attendance-v${{ env.VERSION }}.apk
          if-no-files-found: error

      # Also publishes the APK on the repo's "Releases" page - easiest place to download from a phone.
      - name: Publish release
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: SAM BOND Attendance v${{ env.VERSION }}
          files: SAM-BOND-Attendance-v${{ env.VERSION }}.apk
