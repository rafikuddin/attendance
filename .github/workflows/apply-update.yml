name: Apply Update
on:
  push:
    paths: ['update*.zip']
  workflow_dispatch:
# contents: write lets it save the unpacked files; actions: write lets it start the Build APK workflow afterwards.
permissions:
  contents: write
  actions: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack the update zip
        run: |
          shopt -s nullglob
          zips=(update*.zip)
          if [ ${#zips[@]} -eq 0 ]; then
            echo "::error::No update zip found in the repo root. Upload update.zip first (it is removed after it is applied)."
            exit 1
          fi
          if [ ${#zips[@]} -gt 1 ]; then
            echo "::error::More than one update zip found: ${zips[*]}. Delete the old ones and keep only the newest."
            exit 1
          fi
          echo "Applying: ${zips[0]}"
          unzip -o "${zips[0]}" -d .
          rm -f "${zips[0]}" app/src/main/res/layout/activity_main.xml
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Apply update" || echo "nothing to commit"
          # Another workflow (for example Update Wiki) may push to this branch at the same moment. If GitHub refuses the push,
          # take that newer commit first (rebase) and push again, a few times, instead of failing.
          ok=0
          for i in 1 2 3 4 5; do
            if git pull --rebase --quiet origin "$GITHUB_REF_NAME" && git push --quiet origin "HEAD:$GITHUB_REF_NAME"; then ok=1; break; fi
            echo "The push was refused (another workflow pushed at the same time). Trying again ($i of 5)..."
            git rebase --abort 2>/dev/null || true
            sleep $((i * 4))
          done
          if [ "$ok" != 1 ]; then echo "::error::Could not save the result after 5 tries. Run this workflow again (Actions > Run workflow)."; exit 1; fi

      # A push made by a workflow does not start other workflows by itself, so start Build APK explicitly.
      # (Same as pressing Actions > Build APK > Run workflow, but automatic.)
      - name: Start Build APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build.yml --ref "${{ github.ref_name }}"
