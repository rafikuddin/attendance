name: Apply Update
on:
  push:
    paths: ['update.zip']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          unzip -o update.zip -d .
          rm -f update.zip app/src/main/res/layout/activity_main.xml
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Apply update" || echo "nothing to commit"
          git push
